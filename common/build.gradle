plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('accesstransformer.cfg'))
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    compileOnly("maven.modrinth:geckolib:${geckolib_version}") { transitive = false } // GeckoLib 26.x: Modrinth only, its classes are the same on both loaders
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}
