plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'the-midnight-lurker-neoforge'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*'); includeGroup('com.eliotlash.mclib') }
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven {
        url = 'https://api.modrinth.com/maven' // compatibility runs only
        content { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version


    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
        }
        // Scripted scene (port/DevScene): opens run/saves/ml_scene, screenshots, quits.
        scene {
            client()
            systemProperty 'midnightlurker.scene', project.findProperty('scene') ?: 'true'
        }
        // Server tick check (port/PerfScene): overworld and nether spawning, 20 Lurkers; -Pjfr: run/perf.jfr
        perf {
            client()
            systemProperty 'midnightlurker.perf', 'true'
            if (project.hasProperty('jfr')) {
                jvmArguments.add '-XX:StartFlightRecording=filename=perf.jfr,settings=profile'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Popular client / performance mods for compatibility runs (-Pwith_compat)
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_sodium}"
        localRuntime "maven.modrinth:iris:${compat_iris}"
        localRuntime "maven.modrinth:lithium:${compat_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_ferritecore}"
        localRuntime "maven.modrinth:jade:${compat_jade}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${compat_jei}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            geckolib_version_range : geckolib_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// License texts inside the mod jar
tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_midnightlurker' } }
    from('licenses') { into 'licenses/midnightlurker' }
}
